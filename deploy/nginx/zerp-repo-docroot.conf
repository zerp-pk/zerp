# nginx equivalent of the repo-root .htaccess, for a document root that cannot
# be moved off the repo root (a panel-managed vhost, the shape the Hostinger
# deploy uses today). The whole backend tree sits under the webroot here, so
# these rules are the only thing keeping the source and the database
# credentials private.
#
# Prefer zerp-public-docroot.conf whenever you can point the document root at
# public/. nginx has no .htaccess: if you drop the app into an nginx webroot
# with no config of your own, nothing is denied at all and /.env is public.
#
# Install: adapt server_name/root/fastcgi_pass, drop into
# /etc/nginx/sites-available/zerp, symlink into sites-enabled, then
# `nginx -t && systemctl reload nginx`. Verify with the checklist in README.md.

server {
    listen 80;
    server_name zerp.example.com;

    # The repo root, i.e. the directory holding artisan and public/.
    root /var/www/zerp;

    charset utf-8;
    client_max_body_size 64M;

    # Apache's Options -Indexes.
    autoindex off;

    # -------------------------------------------------------------------
    # Deny rules, each mirroring a RewriteRule [F,L] in the root .htaccess.
    #
    # nginx picks one location per request: exact (=) first, then a matching
    # literal prefix with ^~, then regexes in file order, then the longest
    # plain prefix. Every rule below is exact, ^~, or regex, so all of them
    # are decided before the `location /` that does the routing.
    # -------------------------------------------------------------------

    # Dotfiles, of which .env and .git/config are the ones that actually hurt.
    # The .well-known exception keeps ACME/Let's Encrypt renewals working.
    location ~ /\.(?!well-known) {
        return 403;
    }

    # storage/ is two things at once: the backend directory (logs, framework
    # caches, the `installed` marker) AND the /storage/media/... URL prefix for
    # uploaded files. media/ is the only public prefix; deny the rest. The
    # allow has to come first, since ^~ resolves by longest match.
    location ^~ /storage/media/ {
        try_files /public$uri =404;
    }

    location ^~ /storage/ {
        return 403;
    }

    # vendor/ is not in the .htaccess deny list, but public/vendor/ does not
    # exist, so nothing legitimate is served from this prefix while every
    # request to it reaches real Composer package source under the webroot.
    location ^~ /vendor/ {
        return 403;
    }

    # The rest of the backend tree. Deliberately NOT listed: packages/, which
    # resolves to public/packages/ and serves module images.
    #
    # deploy/ is not in the .htaccess list either. publish.sh strips it from the
    # release tree so it never reaches the Hostinger host, but it is present in
    # any deploy made straight from this repo, and it holds the deployment
    # scripts and server notes. Denied here.
    location ~ ^/(\.git|\.github|app|bootstrap|config|database|deploy|node_modules|resources|routes|stubs|tests)(/|$) {
        return 403;
    }

    # Project files that reveal dependencies, tooling, or deployment detail.
    location ~ ^/(composer\.(json|lock)|package(-lock)?\.json|artisan|deploy\.sh|phpunit\.xml|docker-compose\.yml|Dockerfile|vite\.config\.js|tailwind\.config\.js|postcss\.config\.js|tsconfig\.json|components\.json|extract-translations\.php|.*\.md)$ {
        return 403;
    }

    # The rule above is anchored at the root, so it does not cover the same
    # files one level down. public/packages holds relative symlinks into
    # vendor/zerp/<pkg>, which puts each module's own composer.json and source
    # behind this prefix. Module images are the only thing meant to be served
    # through it. (Apache leaks these today for the same anchoring reason.)
    location ~ ^/packages/.*\.(php|json|lock|md|env|ya?ml|sh)$ {
        return 403;
    }

    # -------------------------------------------------------------------
    # PHP execution
    #
    # Only the front controller runs. Everything else ending in .php is
    # refused, so a stray .php under the webroot (an upload, a leftover
    # installer) cannot execute. This regex is also what stops try_files
    # from serving the root index.php shim as plain text.
    # -------------------------------------------------------------------

    # /index.php is a real URL here: the repo-root shim requires public/index.php.
    # Exact match, so it beats the blanket .php refusal below.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $document_root/public;
        # Apache's mod_rewrite hands PHP the Authorization header explicitly;
        # nginx drops it from the FastCGI params, which breaks Sanctum bearer
        # tokens on the API.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        return 403;
    }

    # -------------------------------------------------------------------
    # Routing
    #
    # Static assets live under public/ but are requested at the root. Apache
    # rewrites them with a prefix list (css|assets|js|build|packages|...);
    # nginx just tries public/ and falls through to the front controller,
    # which covers the same prefixes without enumerating them.
    #
    # Note the missing bare $uri: only /public$uri is ever served as a file,
    # so nothing outside public/ can be read even if a deny rule above is
    # edited away.
    # -------------------------------------------------------------------
    location / {
        try_files /public$uri @front;
    }

    location @front {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $document_root/public;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    access_log /var/log/nginx/zerp-access.log;
    error_log  /var/log/nginx/zerp-error.log;
}
