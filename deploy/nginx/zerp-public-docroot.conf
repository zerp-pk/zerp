# nginx vhost for the standard Laravel layout, where the document root is
# public/. Use this one whenever you control the vhost. It is the safer shape:
# the backend tree is not under the webroot at all, so app/, config/, storage/,
# .git/ and .env are unreachable by construction rather than by deny rule.
#
# The deny rules kept below are defense in depth. They cost nothing and they
# still matter, because public/ contains a `storage` symlink into
# storage/app/public and a `packages` tree of symlinks into vendor/zerp/*, so
# some of the URL prefixes the root .htaccess guards do resolve through here.
#
# Install: adapt server_name/root/fastcgi_pass, drop into
# /etc/nginx/sites-available/zerp, symlink into sites-enabled, then
# `nginx -t && systemctl reload nginx`. Verify with the checklist in README.md.

server {
    listen 80;
    server_name zerp.example.com;

    # Note the /public suffix. This is the whole point of this file.
    root /var/www/zerp/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    # Apache's Options -Indexes.
    autoindex off;

    # Dotfiles. .well-known stays reachable for ACME/Let's Encrypt renewals.
    location ~ /\.(?!well-known) {
        return 403;
    }

    # public/storage is a symlink into storage/app/public, and nginx follows
    # symlinks. media/ is the only prefix uploads are served from; anything
    # else under it is not meant to be public.
    location ^~ /storage/media/ {
        try_files $uri =404;
    }

    location ^~ /storage/ {
        return 403;
    }

    # public/packages holds relative symlinks into vendor/zerp/<pkg>. Module
    # images are the only thing meant to be served through them, so refuse
    # anything executable or source-like that the link tree also exposes.
    location ~ ^/packages/.*\.(php|json|lock|md|env|ya?ml|sh)$ {
        return 403;
    }

    # -------------------------------------------------------------------
    # PHP execution. Only the front controller runs, so a stray .php that
    # ends up under public/ (an upload, a leftover installer) cannot execute.
    # -------------------------------------------------------------------
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Apache's mod_rewrite hands PHP the Authorization header explicitly;
        # nginx drops it from the FastCGI params, which breaks Sanctum bearer
        # tokens on the API.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        return 403;
    }

    # No $uri/ in the list: public/ has no directory-index pages, and including
    # it makes a request for a real directory 403 on autoindex instead of
    # reaching the app, which confirms the directory exists. Falling through to
    # the front controller gives Laravel's own 404 either way.
    location / {
        try_files $uri /index.php?$query_string;
    }

    access_log /var/log/nginx/zerp-access.log;
    error_log  /var/log/nginx/zerp-error.log;
}
